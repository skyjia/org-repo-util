[project]
name = "analysis"
version = "0.1.0"
description = "仓库全面分析工具 - 静态分析 + AI 解读"
authors = [
    {name = "AI Assistant"}
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
    "rich>=12.0.0",
    "requests>=2.28.0",
    "jsonschema>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "lizard>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
analyze = "analysis.bin.analyze:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
